<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Task Manager</title>
<style>
:root{--purple:#6258d8;--ink:#252641;--muted:#85879a;--bg:#f5f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}
header{background:#fff;border-bottom:1px solid #e8e8f0;padding:18px max(20px,calc((100% - 980px)/2));display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800;color:var(--purple)}button{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}
main{max-width:980px;margin:38px auto;padding:0 18px}.muted{color:var(--muted)}h1{margin:5px 0;font-size:32px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.stat,.panel,.task{background:white;border:1px solid #e8e9f0;border-radius:13px}.stat{padding:17px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;font-size:27px;margin-top:8px}
.panel{padding:22px;margin-bottom:25px}.panel h2{margin:0 0 18px;font-size:19px}
form{display:grid;grid-template-columns:1fr 1.4fr 160px;gap:12px;align-items:end}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #dedfea;border-radius:8px;font-size:14px}
.primary{background:var(--purple);color:white}.secondary{background:#efeffb;color:#514ab5}.danger{background:#fff0f0;color:#b74646}
.actions{grid-column:1/-1;display:flex;gap:8px}.hidden{display:none}
.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.listhead h2{font-size:19px}
select{padding:10px;border:1px solid #dedfea;border-radius:8px;background:white}
.task{padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.task h3{margin:0 0 5px;font-size:15px}.task p{margin:0 0 5px;color:#777;font-size:13px}.task small{color:var(--muted)}
.task.done h3{text-decoration:line-through;color:#999}.task-actions{display:flex;gap:7px;flex-wrap:wrap}.task-actions button{font-size:11px;padding:8px 10px}
.empty{text-align:center;padding:35px;background:white;border:1px dashed #d6d7e4;border-radius:12px;color:var(--muted)}
#notice{text-align:center;color:#27805d;min-height:22px}
.auth{max-width:390px;margin:8vh auto;background:white;padding:28px;border:1px solid #e8e9f0;border-radius:14px}.auth h2{margin-top:0}.auth input{margin:8px 0 14px}.auth button{width:100%}
@media(max-width:680px){main{margin:25px auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:22px}form{grid-template-columns:1fr}.actions{grid-column:auto}.task{align-items:flex-start;flex-direction:column}.listhead{gap:8px}.listhead h2{margin:0}header{padding:16px 18px}}
</style>
</head>
<body>
<header><div class="logo">✓ TaskFlow</div><div id="accountArea"></div></header>
<main id="app"></main>
<script>
const KEY="taskflow_easy_tasks_v1", USER="taskflow_easy_user_v1";
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");
let user=localStorage.getItem(USER)||"";
const app=document.getElementById("app"), account=document.getElementById("accountArea");
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function loginView(){account.textContent="";app.innerHTML=`<section class="auth"><div class="logo">✓ TaskFlow</div><h2>Welcome!</h2><p class="muted">Enter a display name to open your task workspace on this browser.</p><label>Your name</label><input id="username" placeholder="Enter your name" maxlength="40"><button class="primary" id="loginBtn">Continue</button><p class="muted" style="font-size:12px">Demo mode: this name is stored only in this browser.</p></section>`;document.getElementById("loginBtn").onclick=()=>{let n=document.getElementById("username").value.trim();if(!n){alert("Please enter your name.");return}user=n;localStorage.setItem(USER,user);render()}}
function render(){
 if(!user){loginView();return}
 account.innerHTML=`<span class="muted">Hi, ${esc(user)}</span> &nbsp; <button class="secondary" id="logout">Log out</button>`;
 app.innerHTML=`<p style="color:var(--purple);font-size:11px;letter-spacing:2px;font-weight:bold">YOUR WORKSPACE</p><h1>My tasks</h1><p class="muted">Plan it. Do it. Track it.</p>
 <section class="stats"><div class="stat"><span>Total tasks</span><strong id="total">0</strong></div><div class="stat"><span>Pending</span><strong id="pending">0</strong></div><div class="stat"><span>Completed</span><strong id="completed">0</strong></div></section>
 <section class="panel"><h2 id="formTitle">Add a new task</h2><form id="taskForm"><input type="hidden" id="editId"><div class="field"><label for="title">Task title *</label><input id="title" maxlength="120" placeholder="e.g. Complete Java assignment" required></div><div class="field"><label for="description">Description</label><input id="description" maxlength="250" placeholder="Optional description"></div><div class="field"><label for="due">Due date</label><input id="due" type="date"></div><div class="actions"><button class="primary" id="saveBtn">Add task</button><button type="button" class="secondary hidden" id="cancel">Cancel</button></div></form></section>
 <div class="listhead"><h2>Task list</h2><select id="filter"><option>All</option><option>Pending</option><option>Completed</option></select></div><section id="list"></section><p id="notice"></p>`;
 document.getElementById("logout").onclick=()=>{user="";localStorage.removeItem(USER);render()};
 document.getElementById("filter").onchange=draw;
 document.getElementById("cancel").onclick=reset;
 document.getElementById("taskForm").onsubmit=submitTask;
 draw();
}
function draw(){
 document.getElementById("total").textContent=tasks.length;
 document.getElementById("pending").textContent=tasks.filter(t=>t.status==="Pending").length;
 document.getElementById("completed").textContent=tasks.filter(t=>t.status==="Completed").length;
 let f=document.getElementById("filter").value, shown=f==="All"?tasks:tasks.filter(t=>t.status===f);
 let list=document.getElementById("list");
 if(!shown.length){list.innerHTML='<div class="empty">No tasks found. Add your first task above.</div>';return}
 list.innerHTML=shown.map(t=>`<article class="task ${t.status==="Completed"?"done":""}"><div><h3>${esc(t.title)}</h3>${t.description?`<p>${esc(t.description)}</p>`:""}<small>${t.due?"Due: "+esc(t.due)+" · ":""}${t.status}</small></div><div class="task-actions"><button class="secondary" onclick="toggleTask(${t.id})">${t.status==="Pending"?"Complete":"Reopen"}</button><button class="secondary" onclick="editTask(${t.id})">Edit</button><button class="danger" onclick="deleteTask(${t.id})">Delete</button></div></article>`).join("");
}
function notice(s){document.getElementById("notice").textContent=s}
function submitTask(e){e.preventDefault();let id=Number(document.getElementById("editId").value),title=document.getElementById("title").value.trim();if(!title)return;let data={title,description:document.getElementById("description").value.trim(),due:document.getElementById("due").value};if(id){let t=tasks.find(x=>x.id===id);Object.assign(t,data);notice("Task updated.")}else{tasks.unshift({...data,id:Date.now(),status:"Pending"});notice("Task added.")}save();reset();draw()}
function reset(){document.getElementById("taskForm").reset();document.getElementById("editId").value="";document.getElementById("formTitle").textContent="Add a new task";document.getElementById("saveBtn").textContent="Add task";document.getElementById("cancel").classList.add("hidden")}
function editTask(id){let t=tasks.find(x=>x.id===id);document.getElementById("editId").value=id;document.getElementById("title").value=t.title;document.getElementById("description").value=t.description;document.getElementById("due").value=t.due;document.getElementById("formTitle").textContent="Edit task";document.getElementById("saveBtn").textContent="Save changes";document.getElementById("cancel").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"})}
function toggleTask(id){let t=tasks.find(x=>x.id===id);t.status=t.status==="Pending"?"Completed":"Pending";save();draw();notice("Task status updated.")}
function deleteTask(id){if(!confirm("Delete this task?"))return;tasks=tasks.filter(t=>t.id!==id);save();draw();notice("Task deleted.")}
render();
</script>
</body>
</html>
